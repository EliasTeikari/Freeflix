services:
  postgres:
    image: postgres:16-alpine
    container_name: freeflix-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: freeflix
      POSTGRES_PASSWORD: freeflix
      POSTGRES_DB: freeflix
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freeflix -d freeflix"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
